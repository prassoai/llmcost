name: ci

on:
  pull_request:
    # ready_for_review lets the weekly sync PR (opened as a draft by
    # GITHUB_TOKEN, which cannot trigger workflows) run CI the moment a human
    # marks it ready — the click is a human actor, so the recursion guard
    # doesn't apply. See sync.yml (draft: always-true).
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - name: go vet
        run: go vet ./...
      - name: staticcheck
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@latest
          staticcheck ./...
      # go test is the validation gate for data syncs: schema parse, table
      # invariants, and data canaries over the vendored LiteLLM data.
      - name: go test
        run: go test ./...
      # Fetched via the authenticated API, not raw.githubusercontent.com —
      # anonymous raw fetches get 429-rate-limited from shared runner IPs.
      - name: embedded data matches VENDORED_FROM pin
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha=$(sed -n 's/^commit: //p' VENDORED_FROM)
          gh api -H "Accept: application/vnd.github.raw" \
            "repos/BerriAI/litellm/contents/model_prices_and_context_window.json?ref=${sha}" > /tmp/upstream.json
          cmp /tmp/upstream.json model_prices_and_context_window.json
